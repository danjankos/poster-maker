<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海报生成器 · POSTER MAKER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #1d1b26;
    --accent: #ff4d6d;
    --accent2: #6c5ce7;
    --bg: #101018;
    --panel: #1b1b28;
    --line: #2e2e42;
  }
  body {
    min-height: 100vh; background: var(--bg); color: #eceaf4;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px 14px 44px;
  }
  h1 { text-align: center; font-size: 34px; font-weight: 800; letter-spacing: 4px; }
  h1 span { color: var(--accent); }
  .subtitle { text-align: center; color: #8f8ca8; letter-spacing: 6px; font-size: 12px; margin-top: 4px; }
  .layout { display: flex; gap: 18px; max-width: 1020px; margin: 22px auto 0; align-items: flex-start; flex-wrap: wrap; }
  .controls { flex: 1 1 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .controls h2 { font-size: 13px; letter-spacing: 3px; color: var(--accent); margin: 16px 0 10px; }
  .controls h2:first-child { margin-top: 0; }
  .previewCol { flex: 1 1 340px; text-align: center; }
  canvas#poster {
    max-width: 100%; border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.55);
    background: #222;
  }
  label { display: block; font-size: 12px; color: #a5a1ba; letter-spacing: 2px; margin: 10px 0 5px; }
  textarea, input[type=text] {
    width: 100%; background: #12121e; border: 1px solid var(--line); color: #fff; border-radius: 10px;
    padding: 9px 11px; font-size: 15px; font-family: inherit; outline: none; resize: vertical;
  }
  textarea:focus, input[type=text]:focus { border-color: var(--accent2); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1; }
  input[type=range] { accent-color: var(--accent); width: 100%; }
  input[type=color] { width: 46px; height: 34px; border: none; background: none; cursor: pointer; padding: 0; }
  select {
    width: 100%; background: #12121e; border: 1px solid var(--line); color: #fff; border-radius: 10px;
    padding: 9px 11px; font-size: 14px; font-family: inherit; outline: none;
  }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw {
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer; border: 2px solid transparent;
    transition: transform .1s ease;
  }
  .sw:hover { transform: scale(1.1); }
  .sw.on { border-color: #fff; }
  button {
    cursor: pointer; border: none; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 700;
    font-family: inherit; transition: transform .06s ease, filter .15s ease;
  }
  button:active { transform: scale(.96); }
  .primary { background: linear-gradient(90deg, var(--accent2), var(--accent)); color: #fff; width: 100%; box-shadow: 0 8px 22px rgba(255,77,109,.3); }
  .ghost { background: #262638; color: #d9d6ea; }
  .filebtn { display: inline-block; background: #262638; color: #d9d6ea; border-radius: 10px; padding: 9px 13px; font-size: 13px; cursor: pointer; }
  input[type=file] { display: none; }
  .hint { font-size: 12px; color: #77738f; margin-top: 8px; text-align: center; }
  .seg { display: flex; background: #12121e; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; background: transparent; color: #a5a1ba; border-radius: 0; padding: 9px 0; font-size: 14px; }
  .seg button.on { background: var(--accent2); color: #fff; }
</style>
</head>
<body>
  <h1>海报<span>生成器</span></h1>
  <div class="subtitle">POSTER MAKER</div>

  <div class="layout">
    <div class="controls">
      <h2>尺寸</h2>
      <select id="sizeSel">
        <option value="900x1200">竖版海报 3:4（900×1200）</option>
        <option value="1080x1080">方形 1:1（1080×1080）</option>
        <option value="1080x1920">手机壁纸 9:16（1080×1920）</option>
        <option value="1200x675">横版 16:9（1200×675）</option>
      </select>

      <h2>背景</h2>
      <div class="swatches" id="swatches"></div>
      <div class="row" style="margin-top:10px">
        <div>
          <label style="margin-top:0">自定义底色</label>
          <input type="color" id="bgColor" value="#6c5ce7">
        </div>
        <div>
          <label style="margin-top:0">或上传背景图</label>
          <label class="filebtn" for="bgFile">选择图片</label>
          <input type="file" id="bgFile" accept="image/*">
        </div>
      </div>

      <h2>文字</h2>
      <label>主标题（可换行）</label>
      <textarea id="titleText" rows="2">夏日音乐节</textarea>
      <label>副标题</label>
      <input type="text" id="subText" value="SUMMER MUSIC FESTIVAL">
      <label>底部小字</label>
      <input type="text" id="footText" value="2026.08.15 · 星光广场 · 免费入场">

      <div class="row">
        <div>
          <label>标题大小</label>
          <input type="range" id="titleSize" min="40" max="220" value="120">
        </div>
        <div>
          <label>标题颜色</label>
          <input type="color" id="titleColor" value="#ffffff">
        </div>
      </div>
      <label>对齐方式</label>
      <div class="seg" id="alignSeg">
        <button data-a="left">左对齐</button>
        <button data-a="center" class="on">居中</button>
        <button data-a="right">右对齐</button>
      </div>
      <div class="row" style="margin-top:12px">
        <label style="margin:0; display:flex; align-items:center; gap:6px; cursor:pointer">
          <input type="checkbox" id="dividerOn" checked style="accent-color:var(--accent)"> 显示装饰线
        </label>
        <label style="margin:0; display:flex; align-items:center; gap:6px; cursor:pointer">
          <input type="checkbox" id="shadeOn" checked style="accent-color:var(--accent)"> 图片上压暗层（让字更清楚）
        </label>
      </div>

      <h2>一键出图</h2>
      <div class="row">
        <button class="ghost" id="randomBtn">🎲 随机灵感</button>
        <button class="ghost" id="clearImgBtn">清除背景图</button>
      </div>
      <div style="height:12px"></div>
      <button class="primary" id="dlBtn">⬇ 下载海报 PNG</button>
      <div class="hint">所有处理都在你的浏览器里完成，不上传服务器</div>
    </div>

    <div class="previewCol">
      <canvas id="poster" width="900" height="1200"></canvas>
      <div class="hint">实时预览 · 下载的是原尺寸高清图</div>
    </div>
  </div>

<script>
  const GRADIENTS = [
    ['落日橙紫', '#ff6a00', '#ee0979'],
    ['深海蓝紫', '#0f2027', '#2c5364'],
    ['薄荷清晨', '#11998e', '#a8e063'],
    ['葡萄汽水', '#8e2de2', '#ff6a95'],
    ['黑金高级', '#0c0c0c', '#434343'],
    ['蜜桃粉', '#ff9a9e', '#fecfef'],
    ['森林秘境', '#134e5e', '#71b280'],
    ['烈焰红', '#cb2d3e', '#ef473a'],
    ['星空靛蓝', '#232526', '#414345'],
    ['柠檬汽水', '#f7971e', '#ffd200'],
  ];
  const SAMPLES = [
    ['夏日音乐节', 'SUMMER MUSIC FESTIVAL', '2026.08.15 · 星光广场 · 免费入场'],
    ['城市夜跑', 'CITY NIGHT RUN', '每晚 20:00 · 江边公园集合'],
    ['新书分享会', 'BOOK TALK', '周六下午 3 点 · 三楼报告厅'],
    ['咖啡上新', 'NEW ARRIVAL', '桂花拿铁 · 第二杯半价'],
    ['毕业快乐', 'HAPPY GRADUATION', '2026 届 · 青春不散场'],
    ['招新啦', 'JOIN US', '摄影社团 · 欢迎小白'],
  ];

  const $ = id => document.getElementById(id);
  const canvas = $('poster'), ctx = canvas.getContext('2d');
  let bgImg = null;
  let gradientIdx = 3; // 默认葡萄汽水
  let solidMode = false;
  let align = 'center';

  // 背景色卡
  const swWrap = $('swatches');
  GRADIENTS.forEach(([name, c1, c2], i) => {
    const d = document.createElement('div');
    d.className = 'sw' + (i === gradientIdx ? ' on' : '');
    d.title = name;
    d.style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
    d.addEventListener('click', () => {
      gradientIdx = i; solidMode = false;
      swWrap.querySelectorAll('.sw').forEach((el, j) => el.classList.toggle('on', j === i));
      draw();
    });
    swWrap.appendChild(d);
  });

  function posterSize() {
    const [w, h] = $('sizeSel').value.split('x').map(Number);
    return [w, h];
  }

  function drawCover(img, W, H) {
    const scale = Math.max(W / img.naturalWidth, H / img.naturalHeight);
    const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
    ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  }

  function draw() {
    const [W, H] = posterSize();
    canvas.width = W; canvas.height = H;

    // 背景
    if (bgImg) {
      drawCover(bgImg, W, H);
      if ($('shadeOn').checked) {
        ctx.fillStyle = 'rgba(10,8,20,0.45)';
        ctx.fillRect(0, 0, W, H);
      }
    } else if (solidMode) {
      ctx.fillStyle = $('bgColor').value;
      ctx.fillRect(0, 0, W, H);
    } else {
      const [, c1, c2] = GRADIENTS[gradientIdx];
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      // 装饰光圈
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(W * 0.85, H * 0.14, W * 0.30, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(W * 0.08, H * 0.9, W * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    const margin = W * 0.09;
    const xFor = () => align === 'left' ? margin : align === 'right' ? W - margin : W / 2;
    ctx.textAlign = align;
    ctx.textBaseline = 'alphabetic';

    const titleLines = $('titleText').value.split('\n').filter(s => s.trim() !== '' || true);
    const tSize = parseInt($('titleSize').value);
    ctx.fillStyle = $('titleColor').value;
    ctx.font = `800 ${tSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
    const lineH = tSize * 1.18;
    const totalTitleH = lineH * titleLines.length;
    let y = H * 0.5 - totalTitleH / 2 + tSize * 0.9;
    // 副标题在上方时，先给标题留位：整体以画面中部为锚点
    titleLines.forEach(line => { ctx.fillText(line, xFor(), y); y += lineH; });

    // 装饰线
    if ($('dividerOn').checked) {
      const ly = y - lineH + tSize * 0.55;
      ctx.strokeStyle = $('titleColor').value;
      ctx.globalAlpha = 0.75; ctx.lineWidth = Math.max(3, tSize * 0.045);
      const lw = W * 0.16;
      const cx = align === 'left' ? margin + lw / 2 : align === 'right' ? W - margin - lw / 2 : W / 2;
      ctx.beginPath(); ctx.moveTo(cx - lw / 2, ly); ctx.lineTo(cx + lw / 2, ly); ctx.stroke();
      ctx.globalAlpha = 1;
      y = ly + tSize * 0.75;
    } else {
      y += tSize * 0.25;
    }

    // 副标题
    const sub = $('subText').value.trim();
    if (sub) {
      ctx.font = `600 ${Math.max(18, tSize * 0.30)}px "PingFang SC","Microsoft YaHei",sans-serif`;
      ctx.globalAlpha = 0.92;
      ctx.fillText(sub, xFor(), y);
      ctx.globalAlpha = 1;
    }

    // 底部小字
    const foot = $('footText').value.trim();
    if (foot) {
      ctx.font = `500 ${Math.max(16, W * 0.026)}px "PingFang SC","Microsoft YaHei",sans-serif`;
      ctx.globalAlpha = 0.85;
      ctx.fillText(foot, xFor(), H - margin * 0.8);
      ctx.globalAlpha = 1;
    }
  }

  // 绑定控件
  ['sizeSel', 'titleText', 'subText', 'footText', 'titleSize', 'titleColor', 'dividerOn', 'shadeOn']
    .forEach(id => $(id).addEventListener('input', draw));
  $('bgColor').addEventListener('input', () => { solidMode = true; swWrap.querySelectorAll('.sw').forEach(el => el.classList.remove('on')); draw(); });
  $('alignSeg').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    align = btn.dataset.a;
    $('alignSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
    draw();
  });
  $('bgFile').addEventListener('change', () => {
    const f = $('bgFile').files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => { bgImg = img; draw(); };
    img.src = URL.createObjectURL(f);
  });
  $('clearImgBtn').addEventListener('click', () => { bgImg = null; $('bgFile').value = ''; draw(); });
  $('randomBtn').addEventListener('click', () => {
    gradientIdx = Math.floor(Math.random() * GRADIENTS.length);
    solidMode = false; bgImg = null; $('bgFile').value = '';
    swWrap.querySelectorAll('.sw').forEach((el, j) => el.classList.toggle('on', j === gradientIdx));
    const s = SAMPLES[Math.floor(Math.random() * SAMPLES.length)];
    $('titleText').value = s[0]; $('subText').value = s[1]; $('footText').value = s[2];
    draw();
  });
  $('dlBtn').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'poster.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });

  draw();
</script>
</body>
</html>
